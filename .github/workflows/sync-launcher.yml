name: Sync launcher from aegis-workstation

# aegis-workstation/templates/workstation/bin/ is where this launcher is
# actually developed and tested (321 Docker/compose-dependent tests that
# cannot run from this repo). This repo is the DISTRIBUTION channel: its own
# release.yml signs and publishes whatever is committed here. This workflow
# is the one step that keeps the two in sync, automatically, so nobody has
# to remember to hand-copy a file again (that already caused real bugs: a
# fix landed in aegis-workstation and this repo kept shipping the stale
# version for several releases).
#
# AEGIS_WORKSTATION_READ_TOKEN is a fine-grained PAT scoped to ONLY
# vangen-group/aegis-workstation, Contents: Read-only. Nothing else. Kept
# here (the public repo) rather than having the private repo push into this
# one, so the narrower-scoped credential lives on the side that pulls.
on:
  schedule:
    - cron: '0 7 * * *' # daily safety net
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aegis-cli
        uses: actions/checkout@v7.0.1
        with:
          path: aegis-cli

      - name: Checkout aegis-workstation (private, read-only)
        uses: actions/checkout@v7.0.1
        with:
          repository: vangen-group/aegis-workstation
          token: ${{ secrets.AEGIS_WORKSTATION_READ_TOKEN }}
          path: aegis-workstation
          sparse-checkout: |
            templates/workstation/bin
            templates/workstation/config/license-keys.json

      - name: Copy the shared launcher files
        run: |
          set -euo pipefail
          SRC=aegis-workstation/templates/workstation
          DST=aegis-cli
          cp "${SRC}/bin/aegis" "${DST}/bin/aegis"
          cp "${SRC}/bin/aegis.cmd" "${DST}/bin/aegis.cmd"
          cp "${SRC}/bin/aegis.ps1" "${DST}/bin/aegis.ps1"
          cp "${SRC}/bin/aegis-license.js" "${DST}/bin/aegis-license.js"
          cp "${SRC}/bin/aegis-activate.js" "${DST}/bin/aegis-activate.js"
          cp "${SRC}/bin/aegis-license-api.js" "${DST}/bin/aegis-license-api.js"
          cp "${SRC}/bin/aegis-secret-protect.js" "${DST}/bin/aegis-secret-protect.js"
          cp "${SRC}/bin/aegis-telemetry.js" "${DST}/bin/aegis-telemetry.js"
          cp "${SRC}/config/license-keys.json" "${DST}/config/license-keys.json"

      - name: Commit and push if changed
        id: changed
        working-directory: aegis-cli
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- bin/ config/; then
            echo "already in sync, nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          SOURCE_SHA="$(git -C ../aegis-workstation rev-parse --short HEAD)"
          # The release this sync cuts is computed BEFORE the commit, so the
          # commit also moves release-please's manifest and VERSION to it. Without
          # that, release-please kept counting from 0.2.17 while the tags were
          # already at v0.6.13, and its standing PR proposed v0.3.0.
          # checkout is shallow and does not bring tags: without this the script
          # would see no previous tag and silently skip every release.
          git fetch --tags --quiet
          LAST="$(git tag --list 'v*' | sort -V | tail -1)"
          NEXT="$(sh scripts/next-release-tag.sh "$LAST")"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          git add bin/ config/
          if [ -n "$NEXT" ]; then
            printf '{\n  ".": "%s"\n}\n' "${NEXT#v}" > .release-please-manifest.json
            printf '%s # x-release-please-version\n' "${NEXT#v}" > VERSION
            git add .release-please-manifest.json VERSION
          fi
          git commit -m "fix(sync): update launcher from aegis-workstation@${SOURCE_SHA}"
          git push

      # A launcher change that only lands in the repository is not delivered:
      # the release workflow is tag-triggered, so without this the sync commit
      # sits there until someone remembers to tag (that is exactly how the
      # 2026-11-05 session shipped four releases by hand). The version
      # arithmetic is a tested script, not inline YAML.
      - name: Tag a release when the launcher changed
        if: steps.changed.outputs.changed == 'true'
        working-directory: aegis-cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The same version the commit step wrote into the manifest and VERSION.
          NEXT="${{ steps.changed.outputs.next }}"
          LAST="$(git tag --list 'v*' | sort -V | tail -1)"
          if [ -z "$NEXT" ]; then
            echo "no previous tag — leaving the first release to a human"
            exit 0
          fi
          echo "tagging $NEXT (previous: $LAST)"
          git tag "$NEXT"
          git push origin "$NEXT"
          # A tag pushed with GITHUB_TOKEN does NOT trigger another workflow
          # (GitHub's anti-recursion rule), so the Release workflow would never
          # run and the tag would dangle with no assets. Dispatch it explicitly.
          gh workflow run release.yml -f tag="$NEXT"
          echo "dispatched release.yml for $NEXT"
