name: Release Please

on:
  push:
    branches: [master]
  # sync-launcher.yml's commits are GITHUB_TOKEN-authored, so they don't
  # trigger this workflow's push listener either (same anti-recursion rule
  # as the tag trigger below) -- this lets a sync be followed by a manual run
  # instead of silently never opening a release PR.
  workflow_dispatch: {}

# The default GITHUB_TOKEN must be allowed to write. On a private repository this
# requires Settings -> Actions -> General -> Workflow permissions to be set to
# "Read and write permissions"; without it the first run fails on permissions,
# not on configuration. Same shape as aegis-workstation's own
# .github/workflows/release-please.yml — see that file's comment for why the
# release pull request merge stays a manual click (a GITHUB_TOKEN-authored
# merge starts no workflow run, so .github/workflows/release.yml's tag trigger
# would never fire).
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      # Read by the dispatch step's `if:` (a step's own env is not visible there).
      HAS_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          # Empty-string fallback when unset: works immediately with manual
          # approval of the release PR's own CI run; set RELEASE_PLEASE_TOKEN
          # (a fine-grained PAT, contents:write + pull-requests:write) to end
          # that manual step, same tradeoff as aegis-workstation.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag created with GITHUB_TOKEN does not start other workflows (GitHub's
      # anti-recursion rule), so merging the release PR left the release with
      # no assets until someone ran release.yml by hand (v0.6.14, 2026-11-07).
      # Dispatch it here, exactly as sync-launcher.yml does for its own tags.
      # With RELEASE_PLEASE_TOKEN (a PAT) the tag push already starts
      # release.yml, so this step stays out of the way to avoid a second run.
      - name: Build, sign and publish the release
        if: ${{ steps.release.outputs.release_created == 'true' && env.HAS_PAT != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "${{ github.repository }}" -f tag="$TAG"
