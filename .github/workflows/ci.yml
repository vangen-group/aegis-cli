name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes under a minute. Without a cap, a test that left a child
    # process alive held the runner for GitHub's 6-hour default (every run
    # from aa65ac2 on, 2026-11-06, ended cancelled at 360 min).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned like aegis-workstation's CI, instead of whatever node the
      # runner image happens to ship (the flags below need >= 22).
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'

      - name: Syntax-check bin/aegis
        run: bash -n bin/aegis

      - name: Run update UX tests
        run: bash tests/update-uiux.test.sh

      - name: Run pull progress tests
        run: bash tests/pull-progress.test.sh

      - name: Run update report tests
        run: bash tests/update-report.test.sh

      # Installer wizard suites (node:test). The provisioning dialog tests run
      # on a real pseudo-terminal via util-linux `script` (preinstalled).
      # One step per test file, each with its own cap: a file that hangs (a
      # leaked child process keeps the output pipe open, so even
      # --test-force-exit cannot end the step) is cut after 3 minutes and named
      # by the step itself. --test-timeout fails a hung test by name;
      # --test-force-exit ends the file when only a leaked handle remains.
      - name: Node version
        run: node --version

      - name: Every test file has its own step below
        run: |
          set -eu
          for f in tests/*.test.js; do
            grep -q "tests/$(basename "$f") 2>&1" .github/workflows/ci.yml || {
              echo "::error::$f has no step in .github/workflows/ci.yml — add one, or it never runs in CI"
              exit 1
            }
          done

      - name: "Installer tests: install-helpers.test.js"
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          set -o pipefail
          node --test --test-timeout=120000 --test-force-exit tests/install-helpers.test.js 2>&1 | tee "test-install-helpers.test.js.log" || {
            grep -E 'not ok|✖|AssertionError|actual:|expected:|Error' "test-install-helpers.test.js.log" | head -40 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: "Installer tests: install-provision.test.js"
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          set -o pipefail
          node --test --test-timeout=120000 --test-force-exit tests/install-provision.test.js 2>&1 | tee "test-install-provision.test.js.log" || {
            grep -E 'not ok|✖|AssertionError|actual:|expected:|Error' "test-install-provision.test.js.log" | head -40 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: "Installer tests: install-steps.test.js"
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          set -o pipefail
          node --test --test-timeout=120000 --test-force-exit tests/install-steps.test.js 2>&1 | tee "test-install-steps.test.js.log" || {
            grep -E 'not ok|✖|AssertionError|actual:|expected:|Error' "test-install-steps.test.js.log" | head -40 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: "Installer tests: install-volume.test.js"
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          set -o pipefail
          node --test --test-timeout=120000 --test-force-exit tests/install-volume.test.js 2>&1 | tee "test-install-volume.test.js.log" || {
            grep -E 'not ok|✖|AssertionError|actual:|expected:|Error' "test-install-volume.test.js.log" | head -40 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: "Installer tests: install-wizard-prereqs.test.js"
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          set -o pipefail
          node --test --test-timeout=120000 --test-force-exit tests/install-wizard-prereqs.test.js 2>&1 | tee "test-install-wizard-prereqs.test.js.log" || {
            grep -E 'not ok|✖|AssertionError|actual:|expected:|Error' "test-install-wizard-prereqs.test.js.log" | head -40 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: "Installer tests: install-wizard.test.js"
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          set -o pipefail
          node --test --test-timeout=120000 --test-force-exit tests/install-wizard.test.js 2>&1 | tee "test-install-wizard.test.js.log" || {
            grep -E 'not ok|✖|AssertionError|actual:|expected:|Error' "test-install-wizard.test.js.log" | head -40 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: "Installer tests: next-release-tag.test.js"
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          set -o pipefail
          node --test --test-timeout=120000 --test-force-exit tests/next-release-tag.test.js 2>&1 | tee "test-next-release-tag.test.js.log" || {
            grep -E 'not ok|✖|AssertionError|actual:|expected:|Error' "test-next-release-tag.test.js.log" | head -40 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: "Installer tests: versioning.test.js"
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          set -o pipefail
          node --test --test-timeout=120000 --test-force-exit tests/versioning.test.js 2>&1 | tee "test-versioning.test.js.log" || {
            grep -E 'not ok|✖|AssertionError|actual:|expected:|Error' "test-versioning.test.js.log" | head -40 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Build the release tarball (no signing, just structure)
        run: bash scripts/build-release-tarball.sh dist/aegis-cli.tar.gz

      - name: Verify the tarball is flat and carries every expected member
        run: |
          set -eu
          entries="$(tar -tzf dist/aegis-cli.tar.gz | sort)"
          expected="$(printf '%s\n' \
            ./ \
            ./VERSION \
            ./aegis \
            ./aegis-activate.js \
            ./aegis-license-api.js \
            ./aegis-license-keys.json \
            ./aegis-license.js \
            ./aegis-secret-protect.js \
            ./aegis-telemetry.js \
            ./aegis.cmd \
            ./aegis.ps1 | sort)"
          if [ "$entries" != "$expected" ]; then
            echo "tarball members do not match what install.sh/aegis update expect:" >&2
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$entries") >&2 || true
            exit 1
          fi
