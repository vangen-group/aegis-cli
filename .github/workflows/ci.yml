name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes under a minute. Without a cap, a test that left a child
    # process alive held the runner for GitHub's 6-hour default (every run
    # from aa65ac2 on, 2026-11-06, ended cancelled at 360 min).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned like aegis-workstation's CI, instead of whatever node the
      # runner image happens to ship (the flags below need >= 22).
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'

      - name: Syntax-check bin/aegis
        run: bash -n bin/aegis

      - name: Run update UX tests
        run: bash tests/update-uiux.test.sh

      # Installer wizard suites (node:test). The provisioning dialog tests run
      # on a real pseudo-terminal via util-linux `script` (preinstalled).
      - name: Run installer tests
        # Failing assertions are also emitted as annotations, so they show on
        # the PR (and through the API) without opening the raw log.
        run: |
          set -o pipefail
          node --version
          # --test-timeout fails a hung test by name; --test-force-exit ends a
          # test file even when a child process or server it started is still
          # alive, so a leak is a reported failure instead of a silent hang.
          node --test --test-timeout=120000 --test-force-exit tests/*.test.js 2>&1 | tee installer-tests.log || {
            grep -E 'not ok|✖|AssertionError|actual:|expected:|Error' installer-tests.log | head -40 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Build the release tarball (no signing, just structure)
        run: bash scripts/build-release-tarball.sh dist/aegis-cli.tar.gz

      - name: Verify the tarball is flat and carries every expected member
        run: |
          set -eu
          entries="$(tar -tzf dist/aegis-cli.tar.gz | sort)"
          expected="$(printf '%s\n' \
            ./ \
            ./aegis \
            ./aegis-activate.js \
            ./aegis-license-api.js \
            ./aegis-license-keys.json \
            ./aegis-license.js \
            ./aegis-secret-protect.js \
            ./aegis-telemetry.js \
            ./aegis.cmd \
            ./aegis.ps1 | sort)"
          if [ "$entries" != "$expected" ]; then
            echo "tarball members do not match what install.sh/aegis update expect:" >&2
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$entries") >&2 || true
            exit 1
          fi
